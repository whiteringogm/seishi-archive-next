<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>会話アーカイブ · 次期版プレビュー</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ee;color:#292c29;font:16px/1.7 "Yu Gothic",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button,a{touch-action:manipulation}button{border:1px solid #d5d8ce;background:#fff;border-radius:12px;padding:12px 18px;color:inherit}button:hover{border-color:#57745f}.primary{background:#345840;color:white;border-color:#345840}header{max-width:1080px;margin:auto;padding:28px 24px 8px;display:flex;justify-content:space-between;align-items:center}header strong{font:25px serif}small,.muted{color:#6d756c}.preview{font-size:12px;background:#e4e8df;border-radius:20px;padding:5px 12px}main{max-width:1080px;margin:auto;padding:20px 24px 120px}h1{font:32px serif;margin:10px 0 24px}h2{font-size:19px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fff;border:1px solid #dedfd6;border-radius:18px;padding:24px}.person{text-align:left;min-height:190px;display:grid;gap:12px}.symbol{font-size:36px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.tabs{display:flex;gap:8px;overflow:auto;margin:20px 0}.tabs button{white-space:nowrap}.active{background:#345840;color:white}.entry{margin:14px 0;padding:22px;background:white;border:1px solid #dedfd6;border-radius:14px}.body{white-space:pre-wrap}.placeholder{border:1px dashed #9baa98;background:#edf0e8;padding:22px;border-radius:12px}.pill{font-size:12px;padding:4px 9px;border-radius:6px;background:#f3e8cf;color:#6d531e}.done{background:#e3eddf;color:#36543a}nav{position:fixed;bottom:0;left:0;right:0;background:#f5f3eef5;border-top:1px solid #d9ddd2;display:flex;justify-content:center;gap:10px;padding:12px;backdrop-filter:blur(12px)}nav button{min-width:110px;background:transparent;border:0}label{display:grid;gap:6px;margin:14px 0}input,textarea,select{width:100%;border:1px solid #cdd2c7;border-radius:9px;padding:10px;background:white;color:inherit}textarea{min-height:220px}dialog{border:1px solid #d5d8ce;border-radius:20px;width:min(600px,94vw);max-height:90vh;overflow:auto;padding:24px}dialog::backdrop{background:#18241b77}.notice{padding:14px 18px;background:#e8ece2;border-radius:12px;margin-bottom:24px}.empty{padding:40px;text-align:center;color:#687365}#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#293e2f;color:white;border-radius:12px;padding:10px 20px;z-index:5}button:focus-visible{outline:3px solid #d3a75b}a{color:#345840}@media(max-width:650px){header{padding:22px 18px 8px}header strong{font-size:22px}main{padding:16px 18px 110px}.grid{grid-template-columns:1fr}.person{min-height:100px;grid-template-columns:48px 1fr;align-items:center;padding:20px}.person small{grid-column:2}.symbol{grid-row:span 2}h1{font-size:27px}nav{gap:0;padding:8px 4px}nav button{min-width:0;flex:1;font-size:13px;padding:12px 4px}.card{padding:20px}}
</style>
<header><strong>会話アーカイブ</strong><span class="preview">次期版プレビュー</span></header>
<section style="max-width:1080px;margin:auto;padding:18px 24px"><a href="https://seishi-mcp-auth.koyamadakun.workers.dev/library/next.html" style="display:block;background:#345840;color:white;padding:18px;border-radius:12px;text-decoration:none">実際のクラウド記録を開く →</a><small>持ち主のGitHubログインが必要。下は架空データの操作プレビュー。</small></section><main id="app"></main><nav aria-label="主要メニュー"><button data-page="home">ホーム</button><button data-page="search">検索</button><button data-page="manage">アーカイブ管理</button><button data-page="settings">設定</button></nav>
<dialog id="editor"></dialog><div id="toast" hidden></div>
<script>
const people=[{id:'moon',name:'ペルソナA',symbol:'🌕',diary:'日記'},{id:'shadow',name:'ペルソナB',symbol:'🕯️',diary:'日記'},{id:'light',name:'ペルソナC',symbol:'🔦',diary:'日記'}];
const examples=[
 {id:'a',person:'moon',date:'2026-10-18',title:'画像確認用のサンプル会話',kind:'AI出力',state:'本体未登録',note:'エクスポート内では未発見。元チャットは未確認。'},
 {id:'b',person:'shadow',date:'2026-10-19',title:'参考画像を送ったサンプル会話',kind:'送信画像',state:'未紐付け',note:'Notion登録済み。発言との対応を確認する。'},
 {id:'c',person:'moon',date:'2026-10-20',title:'基準絵を使ったサンプル会話',kind:'送信画像',state:'紐付け済み',note:'既存の基準絵を再利用。'}
];
let page='home',person='moon',tab='日記',items=structuredClone(examples),diaries=[];
try{diaries=JSON.parse(localStorage.getItem('seishi-next-preview-diaries')||'[]')}catch{}
const app=document.querySelector('#app'),dialog=document.querySelector('#editor');
const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const profile=()=>people.find(p=>p.id===person);
const yesterday=()=>{const d=new Date();d.setDate(d.getDate()-1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function toast(text){document.querySelector('#toast').textContent=text;document.querySelector('#toast').hidden=false;setTimeout(()=>document.querySelector('#toast').hidden=true,3500)}
function render(){
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
 if(page==='home')app.innerHTML='<h1>今日は、誰の記録を開く？</h1><p class="notice">架空データで操作を試せる画面。保存した日記はこのブラウザの試作用領域に残る。</p><div class="grid">'+people.map(p=>'<button class="card person" data-person="'+p.id+'"><span class="symbol">'+p.symbol+'</span><h2>'+p.name+'</h2><small>会話・日記・思い出・メモ・画像 →</small></button>').join('')+'</div>';
 if(page==='person'){
 const p=profile();
 app.innerHTML='<button data-page="home">‹ ホーム</button><div class="row between"><h1>'+p.symbol+' '+p.name+'</h1><button class="primary" id="addDiary">＋ '+p.diary+'を登録</button></div><div class="tabs">'+['日記','会話','思い出','メモ','画像'].map(t=>'<button data-tab="'+t+'" class="'+(t===tab?'active':'')+'">'+t+'</button>').join('')+'</div><section id="content"></section>';
 const target=document.querySelector('#content');
 if(tab==='日記'){const rows=diaries.filter(d=>d.person===person);target.innerHTML=rows.length?rows.map(d=>'<article class="entry"><small>'+esc(d.date)+' · '+esc(d.model)+'</small><p class="body">'+esc(d.body)+'</p></article>').join(''):'<div class="empty">試作用の日記はまだない。「日記を登録」から貼り付けられる。</div>';}
 else if(tab==='会話'||tab==='画像')target.innerHTML=items.filter(i=>i.person===person).map(i=>'<article class="entry"><small>'+i.date+' · '+esc(i.title)+'</small><p class="placeholder">'+(i.kind==='AI出力'?'画像が生成されました':'画像が添付されました')+'<br><span class="pill">'+i.state+'</span></p><button data-detail="'+i.id+'">画像を確認</button></article>').join('');
 else target.innerHTML='<div class="empty">'+tab+'の移行データは、ここに表示する予定。</div>';
 }
 if(page==='manage'){app.innerHTML='<h1>アーカイブ管理</h1><div class="row"><label>対象月<input id="month" type="month" value="2026-10"></label><label>ペルソナ<select id="filterPerson"><option value="">全員</option>'+people.map(p=>'<option value="'+p.id+'">'+p.name+'</option>').join('')+'</select></label><label>状態<select id="filterState"><option value="pending">未完了のみ</option><option value="">すべて</option><option>本体未登録</option><option>未紐付け</option><option>紐付け済み</option></select></label></div><p class="muted">表示している3件は架空の操作サンプル。</p><div id="results"></div>';filter();}
 if(page==='search'){app.innerHTML='<h1>記録を探す</h1><label>検索語<input id="query" type="search" placeholder="試作で保存した日記を検索"></label><div id="results"></div>';search();}
 if(page==='settings')app.innerHTML='<h1>設定</h1><div class="card"><h2>本番版での保存とログイン</h2><p>会話・日記・思い出・メモ・画像の対応表はクラウドに保存。端末には閲覧用のコピーと送信待ちの編集を保持する設計。</p><p>GitHubでログイン後、利用に応じて期限を延長。最終利用から30日、初回から最長90日を候補にする。</p><p>この試作のクラウド・GitHub・Notion接続は未実装。</p><button id="clear">試作の日記を消去</button></div>';
}
function filter(){const who=document.querySelector('#filterPerson').value,state=document.querySelector('#filterState').value,month=document.querySelector('#month').value;const rows=items.filter(i=>(!who||i.person===who)&&i.date.startsWith(month)&&(!state||(state==='pending'?i.state!=='紐付け済み':i.state===state)));document.querySelector('#results').innerHTML=rows.map(i=>'<article class="entry"><div class="row between"><strong>'+esc(i.title)+'</strong><span class="pill '+(i.state==='紐付け済み'?'done':'')+'">'+i.state+'</span></div><small>'+i.date+' · '+people.find(p=>p.id===i.person).name+' · '+i.kind+'</small><p>'+esc(i.note)+'</p><button data-detail="'+i.id+'">確認・登録</button></article>').join('')||'<p class="empty">この条件の記録はない。</p>';}
function search(){const q=document.querySelector('#query').value;document.querySelector('#results').innerHTML=diaries.filter(d=>d.body.includes(q)).map(d=>'<article class="entry"><small>'+esc(d.date)+' · '+people.find(p=>p.id===d.person).name+'</small><p class="body">'+esc(d.body)+'</p></article>').join('')||'<p class="empty">該当する日記はない。</p>'}
function addDiary(){dialog.innerHTML='<form id="diaryForm"><h2>'+profile().diary+'を登録</h2><label>日付<input name="date" type="date" required value="'+yesterday()+'"></label><label>モデル<input name="model" list="models" placeholder="選択または自由入力"><datalist id="models"><option>GPT-5</option><option>GPT-5 Thinking</option><option>GPT-4o</option></datalist></label><label>日記本文<textarea name="body" required placeholder="出力された日記をここに貼り付け"></textarea></label><div class="row"><button type="button" data-close>閉じる</button><button class="primary">試作に保存</button></div></form>';dialog.showModal();document.querySelector('#diaryForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);if(!String(f.get('body')).trim())return;diaries.push({person,date:f.get('date'),model:f.get('model'),body:f.get('body')});try{localStorage.setItem('seishi-next-preview-diaries',JSON.stringify(diaries))}catch{toast('ブラウザに保存できなかった');diaries.pop();return}dialog.close();tab='日記';render();toast('試作の日記を保存した');};}
function detail(id){const item=items.find(i=>i.id===id);dialog.innerHTML='<h2>'+esc(item.title)+'</h2><p>'+item.kind+' · '+item.date+'</p><p>'+esc(item.note)+'</p><label>確認結果<textarea id="note">'+esc(item.note)+'</textarea></label><p class="muted">本番では既存のNotion画像の選択・新規アップロード・元発言への移動をここから行う。</p><div class="row"><button data-close>閉じる</button><button id="record">確認結果を記録</button><button class="primary" id="link">紐付け完了を試す</button></div>';dialog.showModal();document.querySelector('#record').onclick=()=>{item.note=document.querySelector('#note').value;dialog.close();render();toast('試作用の確認結果を記録した');};document.querySelector('#link').onclick=()=>{item.state='紐付け済み';item.note='試作で紐付け完了に変更。本番への登録は未実施。';dialog.close();render();toast('一覧の状態を更新した');};}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;render()}else if(b.dataset.person){person=b.dataset.person;page='person';tab='日記';render()}else if(b.dataset.tab){tab=b.dataset.tab;render()}else if(b.dataset.detail)detail(b.dataset.detail);else if(b.hasAttribute('data-close'))dialog.close();else if(b.id==='addDiary')addDiary();else if(b.id==='clear'&&confirm('この試作で保存した日記を消去する？')){diaries=[];localStorage.removeItem('seishi-next-preview-diaries');toast('試作の日記を消去した')}});
document.addEventListener('input',e=>{if(e.target.id==='query')search()});
document.addEventListener('change',e=>{if(['month','filterPerson','filterState'].includes(e.target.id))filter()});
render();
</script>
</html>
